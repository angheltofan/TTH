<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TTH Manager — Tales & Tech HUB management app.">
  <meta name="theme-color" content="#028FE3">

  <!-- iOS meta tags & icons.
       Note: `apple-mobile-web-app-capable=yes` puts the page in
       standalone/PWA mode when opened from the Home Screen. Some iOS
       versions run those standalone launches inside a stricter fetch
       sandbox where third-party requests (like Supabase auth) can fail
       with `Load failed` (statusCode null). We ONLY enable the PWA
       mode after auth so the login flow always runs in regular Safari
       context. `mobile-web-app-capable` (the standard) stays on so
       Android + Chrome PWA users keep the native-app-like experience. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TTH Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TTH Manager</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
